# [작동원리] GitHub 클라우드(ubuntu)에서 arm64 APK를 빌드해 Actions 산출물(Artifacts)로 올린다.
# - LibreOffice 네이티브 라이브러리는 Git LFS 파일이라 반드시 내려받아야 하며, 대역폭 절약을 위해 캐시한다.
# - flutter_rhwp(Rust 브리지) 컴파일을 위해 Rust 툴체인 + aarch64 안드로이드 타깃을 설치한다.
# - 서명 키가 Secrets에 있으면 그것으로, 없으면 임시 키를 만들어 서명한다
#   (임시 키는 빌드마다 달라 '덮어쓰기 설치'가 안 되므로 개인 사용 시에도 Secrets 등록을 권장).
name: Build APK

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행

# [보안] 빌드 작업의 토큰 권한을 '읽기 전용'으로 최소화한다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # [작동원리] LFS 파일(약 200MB)을 매 빌드마다 받으면 GitHub 무료 LFS 대역폭(월 1GB)이
      # 금방 소진된다. 그래서 체크아웃에서는 LFS를 건너뛰고, jniLibs를 캐시에서 복원한다.
      # 캐시가 없을 때(처음 한 번)만 git lfs pull로 받고 바로 캐시에 저장한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          lfs: false
          persist-credentials: false  # [보안] 토큰이 빌드 폴더에 남지 않게 한다

      - name: LFS 네이티브 라이브러리 캐시 복원
        id: jnilibs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: android/app/src/main/jniLibs
          # 키는 LFS 포인터 파일 내용(해시)으로 만들어, 라이브러리가 바뀌면 자동 갱신된다.
          key: jnilibs-${{ hashFiles('android/app/src/main/jniLibs/**') }}

      - name: LFS 라이브러리 내려받기 (캐시가 없을 때만)
        if: steps.jnilibs-cache.outputs.cache-hit != 'true'
        run: git lfs pull

      - name: LFS 라이브러리 캐시 저장 (처음 한 번)
        if: steps.jnilibs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: android/app/src/main/jniLibs
          key: ${{ steps.jnilibs-cache.outputs.cache-primary-key }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          # [안정성·보안] 최신판이 자동으로 바뀌어 빌드가 깨지거나 예상치 못한 코드가 섞이지 않도록
          # 검증된 버전으로 고정한다(3.50.0은 Gradle 9.3.1을 요구해 현재 프로젝트와 맞지 않음).
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Rust 툴체인 (flutter_rhwp 빌드용)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: aarch64-linux-android

      - name: 서명 키 준비
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            SP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KP="$KEY_PASSWORD"
          else
            echo "::warning::KEYSTORE_BASE64 secret 없음 - 임시 키로 서명합니다."
            SP="$(openssl rand -hex 16)"; KA="temp"; KP="$SP"
            keytool -genkeypair -v -keystore app/release.keystore -alias "$KA" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=local"
          fi
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SP" "$KA" "$KP" > key.properties

      - run: flutter pub get
      # [작동원리] 최신 Flutter/Dart와 맞지 않는 구버전 pdfrx_engine(널 안전성 오류)을
      # 호환되는 최신 패치 버전으로 올린다. (lock 파일은 저장소에 그대로 둠)
      - run: flutter pub upgrade pdfrx pdfrx_engine pdfium_flutter
      # 새 pdfrx 버전에는 이 스크립트가 없을 수 있어 실패해도 계속 진행한다.
      - run: dart run pdfrx:remove_wasm_modules || echo "remove_wasm_modules 없음 - 건너뜀"

      # [작동원리] Hive 어댑터(*.g.dart)는 저장소에 없으므로 빌드 전에 코드 생성을 한다(AGENTS.md 참고).
      - name: Hive 어댑터 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # [검증] 빌드 전에 정적 분석과 HWP 연동 테스트를 먼저 돌려 문제를 빨리 발견한다.
      - name: 정적 분석 (오류 확인용, 경고/정보는 무시)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true   # 기존 코드의 분석 오류로 빌드가 막히지 않게 하되 로그에서 확인

      - name: arm64 릴리스 APK 빌드
        # [작동원리] GitHub/Maven 서버의 일시적 504 오류에 대비해 최대 4번까지 다시 시도한다.
        run: |
          for i in 1 2 3 4; do
            flutter build apk --flavor prod --release --split-per-abi --target-platform android-arm64 && exit 0
            echo "빌드 실패($i/4) — 60초 후 재시도"; sleep 60
          done
          exit 1

      - name: HWP 연동 테스트
        run: flutter test test/hwp_support_test.dart test/korean_locale_test.dart test/simple_home_test.dart

      # [보안 검증] 완성된 APK에 인터넷·카메라·마이크 권한이 없는지 확인한다(있으면 빌드 실패).
      - name: APK 권한 점검
        run: |
          AAPT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then echo "::warning::aapt2 없음 - 권한 점검 건너뜀"; exit 0; fi
          for f in build/app/outputs/flutter-apk/*.apk; do
            PERMS=$("$AAPT" dump permissions "$f")
            echo "$PERMS"
            if echo "$PERMS" | grep -qE "android.permission.(INTERNET|CAMERA|RECORD_AUDIO)"; then
              echo "::error::금지된 권한(INTERNET/CAMERA/RECORD_AUDIO)이 APK에 포함됨"; exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hwp-office-viewer-arm64
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
