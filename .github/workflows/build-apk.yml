# [작동원리] GitHub 클라우드(ubuntu)에서 arm64 APK를 빌드해 Actions 산출물(Artifacts)로 올린다.
# - LibreOffice 네이티브 라이브러리는 Git LFS 파일이라 반드시 내려받아야 하며, 대역폭 절약을 위해 캐시한다.
# - flutter_rhwp(Rust 브리지) 컴파일을 위해 Rust 툴체인 + aarch64 안드로이드 타깃을 설치한다.
# - 서명 키가 Secrets에 있으면 그것으로, 없으면 임시 키를 만들어 서명한다
#   (임시 키는 빌드마다 달라 '덮어쓰기 설치'가 안 되므로 개인 사용 시에도 Secrets 등록을 권장).
name: Build APK

on:
  workflow_dispatch:   # Actions 탭에서 수동 실행

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # [작동원리] LFS 파일(약 200MB)을 매 빌드마다 받으면 GitHub 무료 LFS 대역폭(월 1GB)이
      # 금방 소진된다. 그래서 체크아웃에서는 LFS를 건너뛰고, jniLibs를 캐시에서 복원한다.
      # 캐시가 없을 때(처음 한 번)만 git lfs pull로 받고 바로 캐시에 저장한다.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: LFS 네이티브 라이브러리 캐시 복원
        id: jnilibs-cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/src/main/jniLibs
          # 키는 LFS 포인터 파일 내용(해시)으로 만들어, 라이브러리가 바뀌면 자동 갱신된다.
          key: jnilibs-${{ hashFiles('android/app/src/main/jniLibs/**') }}

      - name: LFS 라이브러리 내려받기 (캐시가 없을 때만)
        if: steps.jnilibs-cache.outputs.cache-hit != 'true'
        run: git lfs pull

      - name: LFS 라이브러리 캐시 저장 (처음 한 번)
        if: steps.jnilibs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/src/main/jniLibs
          key: ${{ steps.jnilibs-cache.outputs.cache-primary-key }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust 툴체인 (flutter_rhwp 빌드용)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 서명 키 준비
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            SP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KP="$KEY_PASSWORD"
          else
            echo "::warning::KEYSTORE_BASE64 secret 없음 - 임시 키로 서명합니다."
            SP="temp-pass-123"; KA="temp"; KP="temp-pass-123"
            keytool -genkeypair -v -keystore app/release.keystore -alias "$KA" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" -dname "CN=local"
          fi
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SP" "$KA" "$KP" > key.properties

      - run: flutter pub get
      # [작동원리] 최신 Flutter/Dart와 맞지 않는 구버전 pdfrx_engine(널 안전성 오류)을
      # 호환되는 최신 패치 버전으로 올린다. (lock 파일은 저장소에 그대로 둠)
      - run: flutter pub upgrade pdfrx pdfrx_engine pdfium_flutter
      - run: dart run pdfrx:remove_wasm_modules   # 웹용 WASM 제거(용량 절감, AGENTS.md 참고)

      # [작동원리] Hive 어댑터(*.g.dart)는 저장소에 없으므로 빌드 전에 코드 생성을 한다(AGENTS.md 참고).
      - name: Hive 어댑터 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # [검증] 빌드 전에 정적 분석과 HWP 연동 테스트를 먼저 돌려 문제를 빨리 발견한다.
      - name: 정적 분석 (오류 확인용, 경고/정보는 무시)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true   # 기존 코드의 분석 오류로 빌드가 막히지 않게 하되 로그에서 확인

      - name: arm64 릴리스 APK 빌드
        run: flutter build apk --flavor prod --release --split-per-abi --target-platform android-arm64

      - name: HWP 연동 테스트
        run: flutter test test/hwp_support_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: hwp-office-viewer-arm64
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
